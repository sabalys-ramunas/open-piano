<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stem split spike</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.45; }
    fieldset { border: 1px solid #8884; border-radius: 8px; margin-bottom: 1rem; }
    label { margin-right: 1rem; }
    progress { width: 100%; height: 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    td, th { padding: .35rem .4rem; border-bottom: 1px solid #8883; text-align: left; }
    input[type=range] { width: 10rem; }
    .muted { opacity: .7; font-size: .9em; }
    pre { white-space: pre-wrap; font-size: .85em; background: #8881; padding: .5rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Stem split spike</h1>
  <p class="muted">Everything runs in this tab. The model files load from this server; nothing is uploaded.</p>

  <fieldset>
    <legend>Song and model</legend>
    <p><label>Recording <input id="file" type="file" accept="audio/*,video/*"></label></p>
    <p>
      <label>Model
        <select id="model">
          <option value="htdemucs">HT-Demucs v4, 4 stems (172 MB)</option>
          <option value="htdemucs_6s">HT-Demucs v4, 6 stems with guitar and piano (272 MB)</option>
          <option value="spleeter4">Spleeter, 4 stems (79 MB, fast)</option>
          <option value="spleeter5">Spleeter, 5 stems with piano (98 MB, fast)</option>
        </select>
      </label>
      <label>Runs on
        <select id="ep">
          <option value="wasm">Processor (WebAssembly)</option>
          <option value="webgpu">Graphics card (WebGPU)</option>
        </select>
      </label>
      <label>Threads
        <select id="threads">
          <option value="0">Automatic</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="4">4</option>
          <option value="8">8</option>
        </select>
      </label>
    </p>
    <p>
      <button id="go" type="button">Split into stems</button>
      <button id="cancel" type="button" disabled>Cancel</button>
    </p>
    <progress id="bar" max="1" value="0"></progress>
    <p id="status" aria-live="polite">Choose a recording.</p>
    <p class="muted" id="env"></p>
  </fieldset>

  <section id="results" hidden>
    <h2>Stems</h2>
    <p>
      <button id="play" type="button">Play together</button>
      <button id="stop" type="button">Stop</button>
      <button id="backing" type="button">Backing for piano (mute other, guitar, piano)</button>
    </p>
    <table>
      <thead><tr><th>Stem</th><th>Volume</th><th>Download</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <pre id="report"></pre>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
